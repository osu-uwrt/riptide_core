/**/riptide_imu:
  ros__parameters:
    port: "/dev/ttyTHS1"
    baud: 460800
    reconnect_ms: 500
    frame_id: "talos/imu_link"
    # declination of current location (degrees) https://www.magnetic-declination.com/
    magneticDeclination: -4.96
    # Error handler
    VNErrorType: [
      "hard fault",
      "serial buffer overflow",
      "ivalid checksum",
      "invalid command",
      "not enough parameters",
      "too many parameters",
      "invalid parameter",
      "invalid register",
      "unauthorized access",
      "watchdog reset",
      "output buffer overflow",
      "insufficient baud rate"]
    # Covariance data
    orientation_covariance: [0.00005,  0.0,   0.0,
                            0.0,   0.00001,  0.0,
                            0.0,   0.0,   0.01]
    # Gyro: measured still noise ~1e-6 (rad/s)^2 (2026-10-27 bench); 1e-5 leaves margin for thruster
    # vibration. At 0.01 the EKF all but ignored it: roll/pitch rates came out ~0.45 s late at ~0.3x.
    angular_velocity_covariance: [0.00001,  0.0,   0.0,
                         0.0,   0.00001,  0.0,
                         0.0,   0.0,   0.00001]
    linear_acceleration_covariance: [0.01,  0.0,   0.0,
                         0.0,   0.01,  0.0,
                         0.0,   0.0,   0.01]
