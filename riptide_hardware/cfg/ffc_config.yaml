      grab_resolution: 'HD1200'
      grab_frame_rate: 15
      self_calib: false
    sensors:
      sensors_image_sync: true
    # svo:
    #   svo_path: "/home/ros/svos/2026/woollett/ffc/torpedo.svo2"
    #   use_svo_timestamps: false
    #   svo_loop: true
    depth:
      depth_mode: "NEURAL_LIGHT" 
      max_depth: 4.0
      depth_stabilization: 0 # Forces positional tracking to start if major than 0 - Range: [0,100]
      depth_confidence: 70
